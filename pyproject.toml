[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "expkit"
version = "0.1.0"
description = "A/B-testing toolkit validated by A/A tests and injected-lift simulations on real user behavior."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chandan Munjal", email = "chandanmunjal@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.13", "db-dtypes>=1.2"]
parallel = ["joblib>=1.3"]
app = ["streamlit>=1.30"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "pytest-cov>=4.1", "hypothesis>=6.90", "ruff>=0.4", "pre-commit>=3.5", "joblib>=1.3", "httpx>=0.27"]
all = ["expkit[bigquery,parallel,app,api]"]

[project.scripts]
expkit = "expkit.cli:main"

# Third-party packages can add statistical methods without touching expkit:
# [project.entry-points."expkit.methods"]
# my_method = "my_pkg.module:register"

[tool.hatch.build.targets.wheel]
packages = ["src/expkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running statistical simulations"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]
