name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,api,app]"   # so the REST and app tests run, not skip
      - run: ruff check src tests experiments data app
      - run: pytest --cov=expkit --cov-report=term-missing
      # Every experiment script must at least run end-to-end (synthetic, tiny).
      - run: make experiments-quick
